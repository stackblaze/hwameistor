name: Build & push RWX images

on:
  push:
    branches:
      - feat/rwx
      - main
    paths:
      - 'cmd/**'
      - 'pkg/**'
      - 'vendor/**'
      - 'build/local-storage/**'
      - 'build/local-storage-nfs-reactor/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/release-rwx-images.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag override (defaults to git short SHA)'
        required: false
        default: ''

permissions:
  contents: read
  # Needed to push to ghcr.io/stackblaze/* with the built-in GITHUB_TOKEN.
  packages: write

jobs:
  build-and-push:
    # Build in GitHub-hosted Ubuntu — the existing Makefile targets assume a
    # Docker-in-Docker builder image that isn't set up here, so we compile
    # the Go binaries directly and then drive the Dockerfiles by hand.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: local-storage
            cmd: ./cmd/local-storage
          - name: local-storage-nfs-reactor
            cmd: ./cmd/local-storage-nfs-reactor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Compute image tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute branch tag
        id: branch
        run: |
          # Replace any slash with a dash so it's a valid image tag.
          echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Compile ${{ matrix.image.name }}
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p _build
          go build -a -mod vendor -installsuffix cgo \
              -o "_build/${{ matrix.image.name }}" \
              "${{ matrix.image.cmd }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/${{ matrix.image.name }}/Dockerfile
          platforms: linux/amd64
          push: true
          # GHCR only — every HwameiStor component in the chart lives under
          # ghcr.io, so keeping these two images there avoids a per-component
          # registry override in the Helm chart.
          tags: |
            ghcr.io/stackblaze/hwameistor-${{ matrix.image.name }}:${{ steps.tag.outputs.tag }}
            ghcr.io/stackblaze/hwameistor-${{ matrix.image.name }}:${{ steps.branch.outputs.tag }}
          # Speed up rebuilds on subsequent runs.
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
