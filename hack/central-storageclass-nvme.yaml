---
# The RWO backing StorageClass that the RWX layer provisions volumes from.
# Must be Immediate: the RWX reactor can only mount and export the LV after
# the backing PVC is bound, so we can't wait for the *user's* consumer pod
# (which references the NFS PV, not this PVC).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hwameistor-storage-lvm-nvme
provisioner: lvm.hwameistor.io
parameters:
  poolClass: NVMe
  poolType: REGULAR
  volumeKind: LVM
  replicaNumber: "1"
  csi.storage.k8s.io/fstype: xfs
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
