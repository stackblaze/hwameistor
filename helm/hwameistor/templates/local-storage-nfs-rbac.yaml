{{- if .Values.rwx.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hwameistor-nfs-server-role
rules:
  - apiGroups:
      - hwameistor.io
    resources:
      - localvolumes
      # Reactor reads Status.DevicePath from LocalVolumeReplica to find the
      # host device node to mount into /srv/exports/<uid>.
      - localvolumereplicas
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - persistentvolumes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hwameistor-nfs-server-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hwameistor-nfs-server-role
subjects:
- kind: ServiceAccount
  name: hwameistor-nfs-server
  namespace: {{ .Release.Namespace }}
{{- end }}
