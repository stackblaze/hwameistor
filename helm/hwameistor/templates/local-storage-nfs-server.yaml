{{- if .Values.rwx.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hwameistor-nfs-server
  namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hwameistor-nfs-server
  namespace: {{ .Release.Namespace }}
  labels:
    app: hwameistor-nfs-server
spec:
  selector:
    matchLabels:
      app: hwameistor-nfs-server
  template:
    metadata:
      labels:
        app: hwameistor-nfs-server
      annotations:
        kubectl.kubernetes.io/default-container: nfs-reactor
    spec:
      serviceAccountName: hwameistor-nfs-server
      hostPID: false
      hostIPC: false
      # Same node affinity as the existing local-storage DaemonSet — serve RWX wherever storage lives.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: lvm.hwameistor.io/enable
                operator: NotIn
                values:
                  - "false"
      containers:
      - name: nfs-reactor
        image: {{ .Values.global.hwameistorImageRegistry }}/{{ .Values.rwx.reactor.imageRepository }}:{{ template "hwameistor.rwxReactorImageTag" . }}
        imagePullPolicy: IfNotPresent
        args:
        - --nodename=$(MY_NODENAME)
        - --pod-ip=$(POD_IP)
        - --pod-namespace=$(POD_NAMESPACE)
        - --ganesha-dbus=unix:path=/run/dbus/system_bus_socket
        - --export-root=/srv/exports
        env:
        - name: MY_NODENAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        securityContext:
          # Required for mount(2) and for accessing /dev
          privileged: true
        volumeMounts:
        - name: dev
          mountPath: /dev
        - name: sys
          mountPath: /sys
          readOnly: true
        - name: exports
          mountPath: /srv/exports
          mountPropagation: Bidirectional
        - name: dbus
          mountPath: /run/dbus
        resources:
          {{- toYaml .Values.rwx.reactor.resources | nindent 10 }}
      - name: ganesha
        image: {{ .Values.rwx.ganesha.image }}
        imagePullPolicy: IfNotPresent
        # The upstream image (ghcr.io/kubernetes-sigs/nfs-ganesha) has an
        # entrypoint of /bin/bash with no command, so we start both
        # dbus-daemon (for AddExport/RemoveExport IPC from the reactor)
        # and ganesha.nfsd explicitly. -F runs Ganesha in the foreground
        # so the container stays alive.
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          mkdir -p /run/dbus \
                   /var/run/ganesha \
                   /var/lib/nfs/ganesha \
                   /var/log/ganesha \
                   /usr/local/var/run/ganesha

          # This container has no init/reaper, so we run bash as PID 1 for
          # the whole lifetime and keep both dbus-daemon and ganesha.nfsd
          # as its children. If we 'exec ganesha.nfsd' bash gets replaced
          # and the orphaned dbus-daemon gets reaped, leaving Ganesha
          # unable to reach the bus.
          dbus-daemon --system --nofork --nopidfile &
          DBUS_PID=$!
          # Wait briefly for the socket to appear so Ganesha's DBus thread
          # can connect on startup.
          for i in 1 2 3 4 5; do
            [ -S /run/dbus/system_bus_socket ] && break
            sleep 1
          done

          ganesha.nfsd -F -L /dev/stdout -f /etc/ganesha/ganesha.conf &
          GANESHA_PID=$!

          # Exit when either child dies so the Pod restarts cleanly.
          wait -n "$DBUS_PID" "$GANESHA_PID"
          exit $?
        securityContext:
          privileged: true
        ports:
        - name: nfs
          containerPort: 2049
          protocol: TCP
        volumeMounts:
        - name: dev
          mountPath: /dev
        - name: sys
          mountPath: /sys
          readOnly: true
        - name: exports
          mountPath: /srv/exports
          mountPropagation: Bidirectional
        - name: dbus
          mountPath: /run/dbus
        - name: ganesha-config
          mountPath: /etc/ganesha
          readOnly: true
        resources:
          {{- toYaml .Values.rwx.ganesha.resources | nindent 10 }}
      volumes:
      - name: dev
        hostPath:
          path: /dev
          type: Directory
      - name: sys
        hostPath:
          path: /sys
          type: Directory
      - name: exports
        # hostPath, not emptyDir: the reactor mounts the backing LV at
        # /srv/exports/<uid>, and those mounts need to survive reactor pod
        # restarts (otherwise a restart sees EBUSY because the LV is still
        # mounted in a previous pod's emptyDir tree on the host). A stable
        # host-visible path also lets ganesha keep serving exports during
        # reactor restarts.
        hostPath:
          path: /var/lib/hwameistor/nfs-exports
          type: DirectoryOrCreate
      - name: dbus
        emptyDir: {}
      - name: ganesha-config
        configMap:
          name: hwameistor-nfs-ganesha-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hwameistor-nfs-ganesha-config
  namespace: {{ .Release.Namespace }}
data:
  ganesha.conf: |
    NFS_Core_Param {
        NFS_Protocols = 4;
        Enable_UDP = false;
        Enable_NLM = false;
        Enable_RQUOTA = false;
    }
    NFSV4 {
        Grace_Period = 30;
    }
    # Exports are added dynamically by the nfs-reactor sidecar via DBus.
    # Without this block Ganesha ignores AddExport/RemoveExport calls.
    NFS_KRB5 {
        Active_krb5 = false;
    }
{{- end }}
