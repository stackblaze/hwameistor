{{- if and .Values.rwx.enabled .Values.rwx.storageClass.enabled }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hwameistor-storage-lvm-rwx
provisioner: lvm.hwameistor.io/rwx
parameters:
  lvm.hwameistor.io/backing-storage-class: {{ .Values.rwx.storageClass.backingStorageClassName | quote }}
reclaimPolicy: {{ .Values.rwx.storageClass.reclaimPolicy }}
allowVolumeExpansion: {{ .Values.rwx.storageClass.allowVolumeExpansion }}
volumeBindingMode: Immediate
{{- end }}
